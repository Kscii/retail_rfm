[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "retail-rfm"
version = "0.1.0"
description = "Reproducible RFM customer segmentation and Dash decision-support prototype"
requires-python = "==3.12.13"
dependencies = [
  "dash==4.1.0",
  "joblib==1.5.3",
  "numpy==2.5.2",
  "pandas==3.0.5",
  "plotly==6.9.0",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
]

[project.scripts]
retail-rfm = "retail_rfm.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/retail_rfm"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["slow: full evidence recomputation"]
